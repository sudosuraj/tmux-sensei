<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <rect width="900" height="210" rx="10" fill="#1a1a1a"/>
  <rect x="0" y="0" width="900" height="30" rx="10" fill="#2b2b2b"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="15" r="6" fill="#febc2e"/>
  <circle cx="60" cy="15" r="6" fill="#28c840"/>
  <text x="450" y="20" fill="#888" font-size="12" text-anchor="middle">root@kali: ~/loot/acme.tld</text>

  <!-- pane content -->
  <text x="20" y="65" fill="#8a8a8a" font-size="14">root@kali:~/loot/acme.tld# nuclei -l http.txt -severity medium,high,critical -o nuclei.txt</text>
  <text x="20" y="90" fill="#8a8a8a" font-size="14">[INF] Templates loaded for scan: 3721</text>
  <text x="20" y="115" fill="#8a8a8a" font-size="14">[medium] [http-missing-security-headers] https://app.acme.tld</text>
  <text x="20" y="140" fill="#8a8a8a" font-size="14">root@kali:~/loot/acme.tld# </text>

  <!-- status bar line 0 -->
  <rect x="0" y="160" width="900" height="24" fill="#262626"/>
  <text x="10" y="177" font-size="13">
    <tspan fill="#87afaf" font-weight="bold">sensei</tspan>
    <tspan fill="#8a8a8a"> acme_tld </tspan>
    <tspan fill="#444444">|</tspan>
    <tspan fill="#8a8a8a"> kali</tspan>
  </text>
  <text x="500" y="177" font-size="13">
    <tspan fill="#d75f5f">tgt:acme.tld  </tspan>
    <tspan fill="#87af5f">REC  </tspan>
    <tspan fill="#8a8a8a">tun0 10.10.14.7  </tspan>
    <tspan fill="#444444">| </tspan>
    <tspan fill="#8a8a8a">21:04</tspan>
  </text>

  <!-- status bar line 1 (windows) -->
  <rect x="0" y="184" width="900" height="24" fill="#262626"/>
  <text x="10" y="201" font-size="13">
    <tspan fill="#ffdfaf" font-weight="bold"> 1:recon </tspan>
    <tspan fill="#808080"> 2:fuzz </tspan>
    <tspan fill="#808080"> 3:shell </tspan>
    <tspan fill="#808080"> 4:notes </tspan>
    <tspan fill="#ffaf00"> 5:burst-acme.tld (quiet)</tspan>
  </text>
  <text x="860" y="201" font-size="13" fill="#444444">5w</text>
</svg>
