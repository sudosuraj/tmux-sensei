<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <rect width="720" height="480" rx="10" fill="#0f0f0f"/>
  <rect x="0" y="0" width="720" height="30" rx="10" fill="#2b2b2b"/>
  <text x="360" y="20" fill="#ccc" font-size="13" text-anchor="middle">keys</text>

  <g fill="#9a9a9a" font-size="12.5">
    <text x="24" y="56" fill="#ffdfaf" font-weight="bold">tmux-sensei — key map (C-s = prefix unless noted)</text>

    <text x="24" y="90" fill="#87afaf" font-weight="bold">PANES &amp; WINDOWS (prefix-free, Alt)</text>
    <text x="34" y="112">M-h/j/k/l    move            M-H/J/K/L   resize</text>
    <text x="34" y="132">M-1..M-5     jump to window  M-o         last window</text>

    <text x="24" y="164" fill="#87afaf" font-weight="bold">PREFIX LAYER (C-s then...)</text>
    <text x="34" y="186">|  -   split      c  new window      R  reload config</text>
    <text x="34" y="206" fill="#ffaf00">Space   enter the sensei MODAL layer (stays until Esc)</text>

    <text x="24" y="238" fill="#87afaf" font-weight="bold">TARGET, EVIDENCE &amp; STAGING</text>
    <text x="34" y="260">t  set @target     T  STAGE a burst.conf chain</text>
    <text x="34" y="280">C  new case        N  case-notes    C-l  toggle logging   P  dump pane</text>

    <text x="24" y="312" fill="#87afaf" font-weight="bold">ATTACKER-IP &amp; CLIPBOARD</text>
    <text x="34" y="334">i / I  copy tun IP / IP menu       B  numbered paste-buffer picker</text>
    <text x="34" y="354">F      grep every pane's scrollback in this session</text>

    <text x="24" y="386" fill="#87afaf" font-weight="bold">MODES &amp; MISC</text>
    <text x="34" y="408" fill="#ff5f5f">S  toggle synchronize-panes (loud when armed)</text>
    <text x="34" y="428">E / g  config popup / git popup      X / C-x  lab socket</text>

    <text x="24" y="460" fill="#666">Full detail: README.md.  tmux list-keys for the raw dump.</text>
  </g>
</svg>
