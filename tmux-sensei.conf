# ══════════════════════════════════════════════════════════════════════════════
#  tmux-sensei — a terminal for people who live in scrollback
#  requires tmux >= 3.3 (developed on 3.4) · no plugin manager · no patched font
#
#  THE LAWS
#   1. One config file + one script. Nothing curl|bash. If I can't audit it in
#      an afternoon, it doesn't run inside my multiplexer.
#   2. Degrade gracefully: no truecolor, no nerd glyphs, no unicode-only status.
#      It must look identical on a serial console into a rescue box.
#   3. tmux never types Enter for me. Anything aimed at a target is *staged*,
#      not executed. Scope mistakes are career events.
#   4. Every session is a case file. Every pane is loggable. Evidence is default,
#      not something I remember to turn on at 3am.
#   5. Experiments run on a separate socket. My live session is not a lab.
#
#  install:
#     mkdir -p ~/.config/tmux && cp tmux-sensei.conf ~/.config/tmux/tmux.conf
#     install -m755 sensei ~/.local/bin/sensei
#     echo 'stty -ixon' >> ~/.bashrc     # frees C-s, see PREFIX below
# ══════════════════════════════════════════════════════════════════════════════

# ─── palette ──────────────────────────────────────────────────────────────────
# 256-colour indices only. Four roles, nothing more:
#   ink 245 · dim 238 · hot 214 (prefix/attention) · tgt 174 (target) · ok 107
#   warn 203 (remote/root pane) · bg 235

# ─── 1. server ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"  # match terminfo so DA probes don't leak
set -s escape-time 10                 # vim in a pane stops feeling drunk
set -s focus-events on
set -s exit-empty off                 # server survives the last session dying
set -g history-limit 200000           # a full ffuf run should fit in scrollback
set -g buffer-limit 100
set -g display-time 2500
set -g detach-on-destroy off          # kill a session -> land on another, not out
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on               # OSC 52: copy from a jump host into my Mac
set -as terminal-features ',*:clipboard:usstyle:RGB'
setw -g mode-keys vi
setw -g status-keys emacs             # command prompt is emacs, editing is vi

# I name windows by phase (recon/fuzz/notes/shell). Nothing gets to rename them.
setw -g allow-rename off
setw -g automatic-rename off

# ─── 2. prefix, and surviving nested tmux ─────────────────────────────────────
# C-b is a cursor key. C-a belongs to readline and to every screen refugee's
# config, so it collides the moment I attach to someone else's box.
# C-s is dead weight once flow control is off -> it's mine.
unbind C-b
set -g prefix C-s
bind C-s send-prefix                  # C-s C-s reaches the inner/remote tmux
bind s   choose-tree -Zs              # reclaim the old 's'

# F12 hands the keyboard entirely to the inner session: local tmux goes deaf and
# visibly greys out, so I always know which multiplexer I'm talking to.
bind -T root F12 \
  set prefix None \; set key-table off \; set status-style 'bg=colour233,fg=colour240' \; \
  refresh-client -S
bind -T off  F12 \
  set -u prefix \; set -u key-table \; set -u status-style \; \
  refresh-client -S

bind R source-file ~/.config/tmux/tmux.conf \; display '  sensei reloaded'

# ─── 3. panes & windows ───────────────────────────────────────────────────────
# splits inherit cwd — a pentest cwd is usually a target directory
bind |  split-window -h -c '#{pane_current_path}'
bind -  split-window -v -c '#{pane_current_path}'
bind c  new-window      -c '#{pane_current_path}'
bind Q  kill-pane                     # no confirm; C-s Q is deliberate enough
bind C-q confirm-before -p 'kill session #S? (y/n)' kill-session

# prefix-free navigation. Alt is free in a terminal; prefix for movement is a tax.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 5
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-o last-window
bind -n M-z resize-pane -Z

# pane borders carry state, because a pane is not just a rectangle:
#   what's running · [remote] if it's an ssh · red border if ssh/sudo/su
setw -g pane-border-status top
setw -g pane-border-format ' #[fg=colour245]#{pane_index} #[fg=colour223]#{pane_current_command}#{?#{==:#{pane_current_command},ssh}, #[fg=colour203][remote],}#{?#{m:*sudo*,#{pane_current_command}}, #[fg=colour203][root],} '
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style '#{?#{||:#{==:#{pane_current_command},ssh},#{==:#{pane_current_command},sudo}},fg=colour203,fg=colour109}'

# ─── 4. the sensei layer ──────────────────────────────────────────────────────
# tmux key-tables are the most underused feature in the program: a real modal
# layer, no plugin required. C-s Space enters it and it *stays* until Escape,
# so a burst of window surgery costs one prefix, not eight.
bind Space switch-client -T sensei

bind -T sensei Escape switch-client -T root
bind -T sensei q      switch-client -T root
bind -T sensei h      { select-pane -L ; switch-client -T sensei }
bind -T sensei j      { select-pane -D ; switch-client -T sensei }
bind -T sensei k      { select-pane -U ; switch-client -T sensei }
bind -T sensei l      { select-pane -R ; switch-client -T sensei }
bind -T sensei H      { resize-pane -L 5 ; switch-client -T sensei }
bind -T sensei J      { resize-pane -D 3 ; switch-client -T sensei }
bind -T sensei K      { resize-pane -U 3 ; switch-client -T sensei }
bind -T sensei L      { resize-pane -R 5 ; switch-client -T sensei }
bind -T sensei x      { kill-pane ; switch-client -T sensei }
bind -T sensei o      { select-layout main-vertical ; switch-client -T sensei }
bind -T sensei e      { select-layout tiled ; switch-client -T sensei }
bind -T sensei m      { swap-pane -D ; switch-client -T sensei }

# ─── 5. copy mode: the grep layer ─────────────────────────────────────────────
# Scrollback is evidence. These are the five things I hunt for in it, bound to
# one key each so I never pipe a pane through grep just to find an IP.
# (tmux search is regex but case-SENSITIVE — the patterns compensate.)
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel 'sensei clip'
bind -T copy-mode-vi Escape send -X cancel
# mouse: when YOU drag a selection, releasing it copies to the OS clipboard
# (no Shift needed). A plain click just moves the cursor — nothing auto-copies.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'sensei clip'
# tmux ships double-click-word / triple-click-line auto-copy by default; disable
# them so a click never copies behind your back. Deliberate select + C-s i/I only.
bind -T root DoubleClick1Pane select-pane
bind -T root TripleClick1Pane select-pane

bind -T copy-mode-vi M-i send -X search-backward '([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?'
bind -T copy-mode-vi M-u send -X search-backward 'https?://[^ "'\''<>]+'
bind -T copy-mode-vi M-x send -X search-backward '\b[0-9a-fA-F]{32,64}\b'
bind -T copy-mode-vi M-t send -X search-backward '(eyJ[A-Za-z0-9_-]{10,}|BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,})'
bind -T copy-mode-vi M-s send -X search-backward '([Ss]ecret|SECRET|[Tt]oken|TOKEN|api[_-]?[Kk]ey|API_KEY|[Pp]assw|[Aa]uthorization|[Bb]earer)'
bind -T copy-mode-vi M-e send -X search-backward '(ERROR|error:|FAIL|Traceback|denied|refused|403|500)'

bind / copy-mode \; send -X search-backward-incremental
bind [ copy-mode
bind ] paste-buffer -p
bind b list-buffers

# ─── 6. case files: logging & evidence ────────────────────────────────────────
# @log is per-session. Off by default (I don't want my personal shell on disk),
# one key to arm, and arming it retro-fits every pane in the session.
bind C-l  run-shell 'sensei log toggle #{session_name}'
bind P    run-shell 'sensei dump "#{pane_id}" "#{session_name}"'   # scrollback -> loot
bind N    display-popup -E -w 80% -h 80% -T ' notes ' 'sensei notes #{session_name}'
bind C    command-prompt -p 'case name:' { run-shell 'sensei case %1' }

# hooks: a newly created pane inherits the session's logging state
set-hook -g after-split-window 'run-shell -b "sensei log inherit #{session_name} #{pane_id}"'
set-hook -g after-new-window   'run-shell -b "sensei log inherit #{session_name} #{pane_id}"'

# target is a session-scoped option, shown in the status bar so I can never
# fat-finger a scan at the wrong scope because I forgot which window I'm in.
bind t command-prompt -p 'target:' 'set -w @target "%%"'

# attacker-IP helpers (exam gold: you paste your tun IP a hundred times)
bind i run-shell 'sensei ipcopy'    # quick: copy the attacker (tun) IP to clipboard
bind I run-shell 'sensei ipmenu'    # clickable menu: click any IP to copy it

bind T run-shell 'sensei burst "#{session_name}" "#{@target}"'   # STAGES commands, no Enter

# ─── 7. popups: things that shouldn't disturb a layout ────────────────────────
# a persistent scratch session in a popup — same shell every time, survives
# detach, never steals a pane from the layout I spent five minutes building.
bind -n M-g display-popup -E -w 85% -h 85% -T ' scratch ' 'tmux new-session -A -s scratch'
bind  E     display-popup -E -w 90% -h 90% -T ' config ' \
  'sh -c "${EDITOR:-vi} ~/.config/tmux/tmux.conf && tmux source-file ~/.config/tmux/tmux.conf"'
bind  g     display-popup -E -w 90% -h 90% -T ' git ' 'sh -c "lazygit 2>/dev/null || git status; read x"'

# ─── 8. long-running command hygiene ──────────────────────────────────────────
# A pane whose scan died at 04:12 must not vanish and take the error with it.
set -g remain-on-exit failed
bind r respawn-pane -k

# monitor-silence is the correct "is my scan done?" primitive: it fires when a
# pane goes quiet, not when it prints. Toggle per window.
bind a setw monitor-silence 45 \; display '  silence watch armed (45s)'
bind A setw monitor-silence 0  \; display '  silence watch off'
set -g visual-bell off
set -g visual-silence on
set -g bell-action other
setw -g monitor-bell on

# ─── 9. status: context, not decoration ───────────────────────────────────────
# Two lines. Top = who/where/what am I attacking. Bottom = windows. The only
# things that get colour are the ones that can hurt me: target, log state, prefix.
set -g status on
set -g status 2
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour245'
set -g message-style 'bg=colour235,fg=colour214'
setw -g mode-style   'bg=colour238,fg=colour223'

set -g status-format[0] '#[align=left]#{?client_prefix,#[fg=colour214#,bold] ^ ,#[fg=colour238]   }#[fg=colour109#,bold]sensei#[fg=colour245#,nobold] #{session_name} #[fg=colour238]|#[fg=colour245] #{host_short}#[align=right]#{?#{@target},#[fg=colour174]tgt:#{@target}  ,}#{?#{@log},#[fg=colour107]REC  ,}#[fg=colour245]#(sensei vpn) #[fg=colour238]| #[fg=colour245]%H:%M '
set -g status-format[1] '#[align=left]#{W:#[fg=colour244] #{window_index}:#{window_name}#{?window_last_flag,-,}#{?window_silence_flag,#[fg=colour214](quiet),} ,#[fg=colour223#,bold] #{window_index}:#{window_name}#{?window_zoomed_flag,+,}#[nobold] }#[align=right]#[fg=colour238]#{session_windows}w '

# ─── 10. the lab (freedom clause) ─────────────────────────────────────────────
# Every experiment gets its own socket and its own config. I break things
# constantly; I have never once broken a live engagement session doing it.
bind X display-popup -E -w 90% -h 90% -T ' lab ' \
  'tmux -L lab -f ~/.config/tmux/lab.conf new-session -A -s lab'
bind C-x run-shell 'tmux -L lab kill-server 2>/dev/null; true' \; display '  lab burned'

# machine-local overrides live outside this file so my dotfiles repo stays clean
# and a VPS can differ from my laptop without a branch.
source-file -q ~/.config/tmux/local.conf
