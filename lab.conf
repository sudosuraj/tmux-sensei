# lab.conf — the experiment socket (tmux -L lab)
# This is where I try configs that might wedge the server. It shares NOTHING
# with the live socket: different prefix, loud colour, no logging, no case files.
# If I trash it: prefix C-x from the main session burns it and I lose nothing.

set -g prefix C-a                      # deliberately different from live (C-s)
unbind C-b
bind C-a send-prefix
set -s escape-time 0
set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1

# unmissable "you are in the lab" banner so I never confuse it with a real session
set -g status-style 'bg=colour53,fg=colour231'
set -g status-left  '#[bg=colour201,fg=colour16,bold] LAB #[default] '
set -g status-right '#[fg=colour231]experiment socket · nothing here is real '
set -g status-left-length 20

bind r source-file ~/.config/tmux/lab.conf \; display '  lab reloaded'
bind e split-window -h "vi ~/.config/tmux/lab.conf"

# scratch space for testing keybinds without fear
bind 1 display 'bind 1 works'
